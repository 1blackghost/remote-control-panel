    <script>
        function updateStatusIndicator(status) {
            const statusIndicator = $('#status-indicator');
            const offlineMessage = $('#offline-message');
            
            if (status === "1") {
                statusIndicator.text('');
                statusIndicator.addClass('glow');
                offlineMessage.text('');
            } else {
                statusIndicator.text('Offline');
                statusIndicator.removeClass('glow');
                offlineMessage.text('The client is currently offline.Changes made now will not be reflected!');
            }
        }

        function checkOnlineStatus() {
            $.ajax({
                url: '/checkOnline',
                type: 'GET',
                success: function(data) {
                    updateStatusIndicator(data);
                },
                error: function() {
                    updateStatusIndicator(0);
                }
            });
        }

        // Initial check on page load
        $(document).ready(function() {
            checkOnlineStatus();
        });

        // Periodically check the online status
        setInterval(function() {
            checkOnlineStatus();
        }, 1000);  // Adjust the interval as needed

        // Tab handling
        $('.tab').on('click', function() {
            const tabId = $(this).attr('id');
            $('.tab-content').hide();
            $('.tab').removeClass('selected-tab');
            $(this).addClass('selected-tab');
            $(`#${tabId}-content`).show();
        });
    </script>
    <script>
             $(document).ready(function() {
    function fetchLogs() {
        $.ajax({
            url: '/logs',
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log(data);

                // Update the logs-container with each entry as a row
                $('#logs-container').empty();
                $.each(data, function(index, value) {
                    var logEntry = $('<div class="log-entry">');
                    logEntry.text(value);
                    $('#logs-container').append(logEntry);
                });
            },
            error: function() {
                console.log('Error fetching logs');
            },
            complete: function() {
                setTimeout(fetchLogs, 1000);
            }
        });
    }

    fetchLogs();
});

    </script>

        $(document).ready(function() {


   $(document).ready(function() {
    $('#upload-button').on('click', function() {
        // Get the selected file
        var fileInput = $('#file-input')[0];
        var file = fileInput.files[0];

        if (!file) {
            alert('Please choose a file');
            return;
        }

        // Create a FormData object to send the file
        var formData = new FormData();
        formData.append('file', file);

        // AJAX request to upload the file
        $.ajax({
            url: '/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            xhr: function() {
                var xhr = new window.XMLHttpRequest();
                // Upload progress handling
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        var percent = (e.loaded / e.total) * 100;
                        $('#upload-progress').val(percent);
                    }
                }, false);
                return xhr;
            },
            success: function(response) {
                alert('File uploaded successfully');
            },
            error: function() {
                alert('Error uploading file');
            },
            complete: function() {
                // Reset progress bar after upload is complete
                $('#upload-progress').val(0);
            }
        });
    });
});

});
